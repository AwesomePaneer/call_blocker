name: Release APK

# Publishes a signed release APK to a GitHub Release whenever a version tag
# (e.g. v1.0) is pushed. Runs entirely on GitHub-hosted runners — no local
# Android toolchain needed.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the Release and upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Stage APK named for the tag
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/prefix-call-blocker-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: out/prefix-call-blocker-*.apk
